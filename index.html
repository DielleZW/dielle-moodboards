<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f5f0">
  <title>Diélle | Wedding Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#302d2b;--muted:#716b66;--ivory:#f8f5f0;--line:#e3dbd1;--gold:#aa916a}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--ivory);font:300 15px/1.75 'DM Sans',sans-serif}a{color:inherit;text-decoration:none}button{font:inherit}img{max-width:100%;display:block}section{scroll-margin-top:120px}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(248,245,240,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.topinner{max-width:1440px;margin:auto;display:flex;align-items:center;gap:30px;padding:12px 5%}.wordmark{font:400 23px 'Playfair Display',serif;letter-spacing:.23em}.links{display:flex;gap:28px;margin-left:auto;overflow:auto;white-space:nowrap;scrollbar-width:none}.links::-webkit-scrollbar{display:none}.links a{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:10px 0}.links a:hover{color:var(--gold)}
    .hero{text-align:center;padding:75px 20px 105px}.hero-logo{width:min(250px,70vw);margin:0 auto 36px;mix-blend-mode:multiply}.eyebrow{text-transform:uppercase;letter-spacing:.28em;font-size:10px;font-weight:600;color:var(--gold)}h1,h2,h3{font-family:'Playfair Display',serif;font-weight:400}h1{font-size:clamp(50px,9vw,112px);letter-spacing:-.045em;line-height:1.1;margin:17px auto 20px}h1 em,h2 em{font-weight:400}.hero-meta{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.hero-desc{max-width:560px;margin:28px auto;color:var(--muted)}.rule{height:1px;width:54px;background:var(--gold);margin:32px auto}
    .section{padding:85px 7%}.inner{max-width:1240px;margin:auto}.section-head{max-width:780px;margin-bottom:45px}h2{font-size:clamp(44px,6vw,76px);line-height:1.15;letter-spacing:-.035em;margin:13px 0 20px}.intro{max-width:650px;color:#625d58}.tone-ivory{background:#fffefa}.tone-blush{background:#f2e8e3}.tone-sand{background:#eee6d9}.tone-sage{background:#e8ebe2}
    .palette{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}.swatch{height:170px;border:1px solid #00000008}.swatch-name{margin-top:11px;text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:600}.hex{color:var(--muted);font-size:11px}.palette-note{color:var(--muted);margin-top:28px}.overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.overview-card{background:#ffffff8c;padding:30px;min-height:210px}.overview-number{font:400 36px 'Playfair Display',serif;color:var(--gold)}.overview-card h3{font-size:27px;margin:9px 0}.overview-card p{font-size:13px;color:var(--muted)}
    .subnav{display:flex;gap:25px;flex-wrap:wrap;border-block:1px solid #0002;padding:14px 0;margin-bottom:35px}.subnav a{font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:600}.group{scroll-margin-top:125px;margin-top:55px}.group h3{font-size:36px;margin:0 0 10px}.group p{max-width:750px;color:var(--muted);margin:0 0 25px}.gallery{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.tile{grid-column:span 4;margin:0}.tile:first-child:nth-last-child(2),.tile:first-child:nth-last-child(2)~.tile{grid-column:span 6}.tile img{width:100%;aspect-ratio:4/5;object-fit:cover;cursor:zoom-in;background:#ffffff80}.tile figcaption{font-size:11px;color:var(--muted);margin-top:9px}.missing{min-height:180px;aspect-ratio:4/5;display:grid;place-items:center;background:#ffffff66;border:1px dashed #bfb4a8;padding:15px;text-align:center;color:var(--muted);font-size:12px}.gallery .missing{cursor:default}
    footer{text-align:center;padding:70px 20px;background:#363c35;color:#f8f5f0}footer .wordmark{font-size:31px}footer p{font-size:10px;letter-spacing:.17em;text-transform:uppercase;opacity:.8}.notfound{max-width:720px;margin:75px auto;padding:30px;text-align:center}.notfound h1{font-size:48px}.notfound code{overflow-wrap:anywhere}.lightbox{display:none;position:fixed;inset:0;z-index:100;background:#111e;align-items:center;justify-content:center;padding:65px 20px 25px}.lightbox.open{display:flex}.lightbox img{max-height:85vh;width:auto;object-fit:contain}.close{position:absolute;right:22px;top:12px;border:0;background:transparent;color:white;font-size:35px;cursor:pointer}
    @media(max-width:800px){.topinner{display:block;padding:10px 20px}.wordmark{display:block;margin-bottom:4px}.links{gap:22px}.links a{font-size:9px}.hero{padding:55px 20px 75px}.hero-logo{width:min(205px,65vw)}.section{padding:65px 22px}.palette{gap:8px}.swatch{height:95px}.swatch-name,.hex{font-size:9px}.overview{grid-template-columns:1fr}.overview-card{min-height:0}.gallery{gap:12px}.tile,.tile:first-child:nth-last-child(2),.tile:first-child:nth-last-child(2)~.tile{grid-column:span 6}.group h3{font-size:29px}}
  </style>
  <script src="client-config.js" defer></script>
  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
      const clients=window.DIELLE_CLIENTS||{};
      const params=new URLSearchParams(location.search);
      const slug=params.get('client')||Object.keys(clients)[0];
      const client=clients[slug];
      const root=document.getElementById('app');
      const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
      const append=(parent,...children)=>{children.forEach(c=>parent.append(c));return parent};
      const anchor=(label,href)=>{const a=el('a','',label);a.href=href;return a};
      if(!client){const n=el('div','notfound');append(n,el('h1','', 'Moodboard not found'),el('p','', 'This client link is not available. Please check the link with Diélle.'));root.append(n);return}
      document.title=`${client.couple} | Diélle Moodboard`;
      const sections=Array.isArray(client.sections)?client.sections:[];
      const nav=el('nav','topbar'),bar=el('div','topinner'),brand=anchor('DIÉLLE','#home'),links=el('div','links');brand.className='wordmark';append(links,anchor('Palette','#palette'),anchor('Day Overview','#overview'));
      sections.forEach(s=>links.append(anchor(s.title,'#'+s.id)));
      append(bar,brand,links);nav.append(bar);root.append(nav);
      const hero=el('header','hero');hero.id='home';const logo=el('img','hero-logo');logo.src='dielle-logo.jpg';logo.alt='Diélle floral design, styling, lighting and production logo';append(hero,logo,el('div','eyebrow',client.kicker||'A Wedding Design Story'));
      const h1=el('h1','',client.couple||'Wedding Design');hero.append(h1,el('div','hero-meta',[client.date,client.venue].filter(Boolean).join(' · ')),el('div','rule'),el('p','hero-desc',client.introduction||''));root.append(hero);
      const makeSection=(id,tone,eyebrow,title,intro)=>{const s=el('section','section tone-'+tone);s.id=id;const inner=el('div','inner'),head=el('div','section-head');append(head,el('div','eyebrow',eyebrow),el('h2','',title),el('p','intro',intro||''));append(inner,head);s.append(inner);root.append(s);return inner};
      const palette=makeSection('palette','ivory','The Design Direction','The Palette','A considered balance of tones, textures and finishes.');const swatches=el('div','palette');(client.colors||[]).forEach(c=>{const item=el('div'),sw=el('div','swatch');if(/^#[0-9a-f]{6}$/i.test(c.hex||''))sw.style.background=c.hex;append(item,sw,el('div','swatch-name',c.name||''),el('div','hex',c.hex||''));swatches.append(item)});append(palette,swatches,el('p','palette-note',client.paletteNote||''));
      const overview=makeSection('overview','sage','The Celebration','Day Overview','A seamless journey through the day, with each environment connected to the next.');const cards=el('div','overview');sections.forEach((s,i)=>{const card=anchor('', '#'+s.id);card.className='overview-card';append(card,el('div','overview-number',String(i+1).padStart(2,'0')),el('h3','',s.title),el('p','',s.introduction||''));cards.append(card)});overview.append(cards);
      const lightbox=el('div','lightbox');lightbox.id='lightbox';lightbox.setAttribute('role','dialog');lightbox.setAttribute('aria-modal','true');lightbox.setAttribute('aria-label','Image preview');const close=el('button','close','×');close.type='button';close.setAttribute('aria-label','Close image');const big=el('img');append(lightbox,close,big);const hide=()=>{lightbox.classList.remove('open');big.removeAttribute('src')};close.onclick=hide;lightbox.onclick=e=>{if(e.target===lightbox)hide()};document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
      sections.forEach((s,i)=>{const inner=makeSection(s.id,['ivory','blush','sand','sage'].includes(s.tone)?s.tone:'ivory',s.eyebrow||`Environment ${i+1}`,s.title,s.introduction);const sub=el('div','subnav');(s.groups||[]).forEach((g,j)=>sub.append(anchor(g.title,'#'+s.id+'-group-'+j)));inner.append(sub);(s.groups||[]).forEach((g,j)=>{const group=el('div','group');group.id=s.id+'-group-'+j;append(group,el('h3','',g.title),el('p','',g.description||''));const gallery=el('div','gallery');(g.images||[]).forEach(image=>{const figure=el('figure','tile'),img=el('img');img.loading='lazy';img.alt=image.caption||'Wedding inspiration';img.src=image.src;img.onerror=()=>{img.replaceWith(el('div','missing','Upload image: '+image.src))};img.onclick=()=>{big.src=img.src;big.alt=img.alt;lightbox.classList.add('open')};append(figure,img,el('figcaption','',image.caption||''));gallery.append(figure)});group.append(gallery);inner.append(group)})});
      const footer=el('footer');append(footer,el('div','wordmark','DIÉLLE'),el('p','Floral Design · Styling · Lighting · Production'),el('p','Curated with care'));root.append(footer,lightbox);
    });
  </script>
</head>
<body><main id="app"></main></body>
</html>
